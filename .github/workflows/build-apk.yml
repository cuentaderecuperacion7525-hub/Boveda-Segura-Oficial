name: Compilador APK Android (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Instalar dependencias de Node
        run: npm ci || npm install

      - name: Generar construcción web y sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Android con Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Preparar archivos para Release
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ./Boveda-Calculadora.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk ./Boveda-Calculadora.apk
          fi
          cp public/version.json ./version.json

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Boveda-Calculadora.apk

      - name: Publicar Release oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: Versión 1.0.15 - Ventana de Confirmación Nativa Google Forzada
          body: |
            Invalidación en caliente de caché de permisos para desplegar siempre la ventana nativa "Permitir / Cancelar" de Google Play Services.
          files: |
            Boveda-Calculadora.apk
            version.json
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
