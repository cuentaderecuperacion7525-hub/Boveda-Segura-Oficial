name: Compilador APK Android (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Instalar dependencias de Node
        run: npm ci || npm install

      - name: Generar construcción web y sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Crear keystore si no existe
        run: |
          if [ ! -f android/boveda.keystore ]; then
            keytool -genkeypair -v -keystore android/boveda.keystore -alias boveda \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -dname "CN=Boveda, OU=App, O=Boveda, C=MX"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f android/boveda.keystore
            git commit -m "Agregar keystore fija"
            git push
          fi
          echo "===== HUELLAS PARA FIREBASE ====="
          keytool -list -v -keystore android/boveda.keystore -alias boveda -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -E "SHA1|SHA256"

      - name: Compilar APK Android con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/boveda.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: boveda
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Preparar archivos para Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Boveda-Calculadora.apk
          cp public/version.json ./version.json

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Boveda-Calculadora.apk

      - name: Publicar Release oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.16
          name: Versión 1.0.16 - Compilador Unificado Permanente
          body: |
            Compilado APK unificado firmado con la clave permanente para actualización transparente en 1 clic.
          files: |
            Boveda-Calculadora.apk
            version.json
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
